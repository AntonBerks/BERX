<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Анимированный символ BERX">
  <defs>
    <linearGradient id="abg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22F1E7"><animate attributeName="offset" values="0;.15;0" dur="4.2s" repeatCount="indefinite"/></stop>
      <stop offset=".55" stop-color="#2F6DFF"/>
      <stop offset="1" stop-color="#8A4BFF"><animate attributeName="offset" values="1;.85;1" dur="4.2s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="aglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.6" result="b">
        <animate attributeName="stdDeviation" values="3.2;6;3.2" dur="3.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#aglow)">
    <g fill="none" stroke="url(#abg1)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
       stroke-dasharray="230" stroke-dashoffset="230">
      <path d="M34 21V99">
        <animate attributeName="stroke-dashoffset" values="230;0" dur="1.1s" begin="0s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
      </path>
      <path d="M34 21h35a19 19 0 0 1 0 38H34">
        <animate attributeName="stroke-dashoffset" values="230;0" dur="1.1s" begin=".25s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
      </path>
      <path d="M34 59h39a20 20 0 0 1 0 40H34">
        <animate attributeName="stroke-dashoffset" values="230;0" dur="1.1s" begin=".45s" fill="freeze" calcMode="spline" keySplines=".16 1 .3 1"/>
      </path>
    </g>
  </g>
  <circle cx="95" cy="27" r="0" fill="#22F1E7">
    <animate attributeName="r" values="0;5" dur=".4s" begin="1.2s" fill="freeze"/>
  </circle>
</svg>
