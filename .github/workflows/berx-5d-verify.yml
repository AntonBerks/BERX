name: BERX 5D Verification

on:
  push:
    branches: [berx-5d-max-runtime]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Static verification
        run: npm run verify:static
      - name: V9 contracts
        run: npm run verify:v9
      - name: Build spatial web
        run: npm run build:spatial-web
      - name: Web V9 probe
        run: npm run verify:v9:web
