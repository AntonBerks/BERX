name: BERX 5D Verification

on:
  push:
    branches: [berx-5d-max-runtime]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      # The web probe drives a real Chromium; a runner has none until it
      # is fetched. Without this every run died at the last step with
      # "executable doesn't exist", whatever the code under test did.
      - name: Install Chromium for the web probe
        run: npx --yes playwright install --with-deps chromium
      - name: Typecheck
        run: npm run typecheck
      - name: Static verification
        run: npm run verify:static
      - name: Executable 5D runtime invariants
        run: npm run verify:5d-runtime
      - name: 5D geometry and quality invariants
        run: npm run verify:5d-geometry
      - name: Shared 5D core is platform-free
        run: npm run verify:5d-shared-core
      - name: 5D world — X/Y/Z + T + R
        run: npm run verify:5d-world
      - name: 5D GPU world in a real browser
        run: npm run verify:5d-gpu
      - name: 5D lighting and materials, measured in pixels
        run: npm run verify:5d-lighting
      - name: One world across every platform target
        run: npm run verify:5d-platforms
      - name: The world is the application (zero flat)
        run: npm run verify:5d-app-shell
      - name: V9 contracts
        run: npm run verify:v9
      - name: Build spatial web
        run: npm run build:spatial-web
      - name: Web V9 probe
        run: npm run verify:v9:web
      - name: Blockers stay honest
        run: npm run verify:5d-blockers
      - name: Full MAX 5D launch gate
        run: npm run verify:5d-launch-gate
