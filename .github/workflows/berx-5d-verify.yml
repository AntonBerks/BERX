name: BERX 5D Verification

on:
  push:
    branches: [berx-5d-max-runtime]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      # The web probe drives a real Chromium; a runner has none until it
      # is fetched. Without this every run died at the last step with
      # "executable doesn't exist", whatever the code under test did.
      - name: Install Chromium for the web probe
        run: npx --yes playwright install --with-deps chromium
      # A runner has no graphics hardware, so without a software Vulkan
      # driver Chromium grants no WebGPU adapter and every GPU gate
      # reports blocked — honest, but it proves nothing. lavapipe makes
      # submission, execution and pixel readback real so the gates can
      # measure them. It is slow and is not a performance claim.
      - name: Install a software Vulkan driver so the GPU gates can run
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      # The desktop backend is a Rust crate rendering through wgpu. The
      # runner has the toolchain preinstalled; the cache keeps the wgpu
      # dependency tree from being rebuilt on every run.
      - name: Cache the native renderer's crates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            client/packages/spatial-native/target
          key: berx-native-${{ runner.os }}-${{ hashFiles('client/packages/spatial-native/Cargo.toml') }}
          restore-keys: berx-native-${{ runner.os }}-
      - name: Typecheck
        run: npm run typecheck
      - name: Static verification
        run: npm run verify:static
      - name: Executable 5D runtime invariants
        run: npm run verify:5d-runtime
      - name: 5D geometry and quality invariants
        run: npm run verify:5d-geometry
      - name: Shared 5D core is platform-free
        run: npm run verify:5d-shared-core
      - name: 5D world — X/Y/Z + T + R
        run: npm run verify:5d-world
      - name: 5D GPU world in a real browser
        run: npm run verify:5d-gpu
      - name: 5D lighting and materials, measured in pixels
        run: npm run verify:5d-lighting
      - name: One world across every platform target
        run: npm run verify:5d-platforms
      - name: The world is the application (zero flat)
        run: npm run verify:5d-app-shell
      - name: Desktop — the native renderer agrees with the web one
        run: npm run verify:5d-desktop
      - name: V9 contracts
        run: npm run verify:v9
      - name: Build spatial web
        run: npm run build:spatial-web
      - name: Web V9 probe
        run: npm run verify:v9:web
      - name: Blockers stay honest
        run: npm run verify:5d-blockers
      - name: Full MAX 5D launch gate
        run: npm run verify:5d-launch-gate
